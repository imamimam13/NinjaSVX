###############################################################################
#                                                                             #
#              🥷  NINJASVX TACTICAL SVXLINK CONFIGURATION                    #
#              Optimized for Web Remote Control & Real-time Telemetry         #
#                                                                             #
###############################################################################

[GLOBAL]
MODULE_PATH=/usr/lib/svxlink
LOGICS=SimplexLogic
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT="%c"
CARD_SAMPLE_RATE=48000
CARD_CHANNELS=1
LINKS=LinkToReflector

[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleHelp,ModuleParrot,ModuleEchoLink
CALLSIGN=YB0NINJA
SHORT_IDENT_INTERVAL=10
LONG_IDENT_INTERVAL=60
EVENT_HANDLER=/usr/share/svxlink/events.tcl
DEFAULT_LANG=en_US
RGR_SOUND_DELAY=250
REPORT_CTCSS=88.5
TX_CTCSS=ALWAYS
STATE_PTY=/tmp/svxlink_state_pty

[LinkToReflector]
CONNECT_LOGICS=SimplexLogic:91:DEFAULT,ReflectorLogic:91
DEFAULT_ACTIVE=1
TIMEOUT=300

[ReflectorLogic]
TYPE=Reflector
HOST=reflector.svxlink.org
PORT=5300
CALLSIGN=YB0NINJA
AUTH_KEY=YourReflectorPassword
DEFAULT_TG=91
MONITOR_TGS=91,92,93,510
TG_SELECT_TIMEOUT=30
STATE_PTY=/tmp/svxlink_reflector_pty

[Rx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
SQL_DET=GPIO
GPIO_SQL_PIN=gpio24
SQL_START_DELAY=0
SQL_DELAY=40
SQL_HANGTIME=300
DTMF_DEC_TYPE=PTY
DTMF_PTY=/tmp/svxlink_dtmf_pty

[Tx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
PTT_TYPE=GPIO
PTT_PIN=gpio25
PTT_HANGTIME=1000
TIMEOUT=300
TX_DELAY=500
CTCSS_FQ=88.5
CTCSS_MODE=ALWAYS
